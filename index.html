<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La roue des caca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto;
        }

        @media (min-width: 640px) {
            .wheel-container {
                width: 380px;
                height: 380px;
            }
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #3b82f6;
            position: relative;
            overflow: hidden;
            transition: transform 4.5s cubic-bezier(0.15, 0.75, 0.1, 1);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.3);
        }

        .pointer {
            width: 0; 
            height: 0; 
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-bottom: 30px solid #1e293b;
            position: absolute;
            top: -12px;
            left: calc(50% - 14px);
            z-index: 20;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.3));
        }

        /* Centre de la roue avec l'image entière visible */
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 4px solid white;
            background-color: white;
            z-index: 15;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slice {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: 100% 100%;
            left: 0;
            top: 0;
            pointer-events: none;
        }

        .slice-text {
            position: absolute;
            left: 35px;
            top: 25px;
            font-size: 11px;
            font-weight: 700;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            transform: rotate(45deg);
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-rose-50 via-pink-50 to-amber-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <header class="w-full py-6 px-4 text-center bg-white/65 backdrop-blur-md shadow-sm border-b border-rose-100">
        <h1 class="text-3xl sm:text-4xl font-extrabold text-rose-600 tracking-tight">💩 La roue des caca 💩</h1>
        <p class="text-slate-600 mt-1 text-base sm:text-lg font-medium">Il est l'heure de se remplir le ventre caca</p>
    </header>

    <main class="max-w-6xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 my-auto">
        
        <!-- Wheel Section -->
        <div class="lg:col-span-6 bg-white rounded-3xl p-6 shadow-xl border border-rose-100 flex flex-col items-center justify-between">
            <div class="w-full text-center mb-2">
                <h2 class="text-xl font-bold text-slate-700">La roue vers l'obésité...</h2>
                <p id="remaining-count" class="text-xs text-slate-400 mt-1">0 établissements restants</p>
            </div>

            <!-- Choix du joueur -->
            <div class="flex gap-2 my-2 w-full justify-center">
                <button onclick="setPlayer('hicham')" id="btn-hicham" class="flex-1 py-2 px-3 text-xs font-bold rounded-xl border-2 border-blue-500 bg-blue-50 text-blue-600 transition shadow-sm">
                    👑 Hicham
                </button>
                <button onclick="setPlayer('margot')" id="btn-margot" class="flex-1 py-2 px-3 text-xs font-bold rounded-xl border-2 border-slate-200 bg-slate-50 text-slate-500 transition shadow-sm">
                    🤪 Margot
                </button>
            </div>

            <div class="wheel-container my-2">
                <div class="pointer"></div>
                <!-- Centre cliquable -->
                <div class="wheel-center" onclick="document.getElementById('file-input').click()" title="Clique pour changer la photo">
                    <img id="real-img" src="couple.jpg" alt="Photo" class="w-full h-full object-contain" onerror="this.style.display='none'; document.getElementById('center-text').style.display='block';">
                    <span id="center-text" class="absolute text-white text-[10px] font-bold bg-black/50 px-1 rounded" style="display:none;">Photo</span>
                </div>
                <input type="file" id="file-input" accept="image/*" class="hidden" onchange="loadLocalImage(event)">
                <div id="wheel"></div>
            </div>

            <div class="w-full mt-4 flex flex-col items-center gap-4">
                <button id="spin-btn" onclick="spinWheel()" class="w-full sm:w-auto px-8 py-4 bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white font-bold text-lg rounded-2xl shadow-lg shadow-rose-500/30 transform transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                    Lancer la vite j'ai faim ! 🎡
                </button>
                <div id="result-display" class="text-center min-h-[40px] text-lg font-semibold text-slate-700 flex items-center justify-center"></div>
            </div>
        </div>

        <!-- Management Section -->
        <div class="lg:col-span-6 bg-white rounded-3xl p-6 shadow-xl border border-rose-100 flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-slate-700">Liste des Restos & Bars</h2>
                    <button onclick="resetList()" class="text-xs text-rose-500 hover:text-rose-700 font-semibold bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-lg transition">
                        Réinitialiser tout
                    </button>
                </div>

                <!-- Input to add item -->
                <div class="flex gap-2 mb-4">
                    <input type="text" id="resto-input" placeholder="Ajouter un resto ou un bar..." onkeypress="handleKeyPress(event)" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                    <button onclick="addResto()" class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-3 rounded-xl text-sm font-semibold transition shadow-md">
                        Ajouter
                    </button>
                </div>

                <!-- List of items -->
                <div class="bg-slate-50 rounded-2xl p-3 border border-slate-100 max-h-[300px] sm:max-h-[350px] overflow-y-auto">
                    <ul id="resto-list" class="space-y-2">
                        <!-- Dynamic items -->
                    </ul>
                </div>
            </div>

            <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-400">
                on va finir pauvre avec tout ça !!!!!!!
            </div>
        </div>

    </main>

    <footer class="w-full py-4 text-center text-xs text-slate-400 bg-white/40 border-t border-rose-50">
        Fait avec amour (et faim) par le grand HICHAM 🍕🍣🍷
    </footer>

    <script>
        const defaultRestos = [
            "Jip", "Scarpetta", "Red sauce", "Dokidoki", "Hando", "Foujita", "Macario", 
            "Chez soyonne", "Pochana", "Saigon dantan", "Buck", "Restaurant zen", 
            "Jinchan shokudo", "Sugo", "May hong", "Via del campo", "Carboni", 
            "La belle maison", "Muniyandi vilas", "Monsieur show", "Yume house", 
            "Rosario", "Tarantula Paris", "Salto bar", "Frenchie bar à vin", 
            "Candelaria", "Eupatoria 5", "Trouble"
        ];

        let restos = [...defaultRestos];
        let isSpinning = false;
        let currentRotation = 0;
        let currentPlayer = 'hicham'; // 'hicham' ou 'margot'

        const colors = [
            "#f43f5e", "#fb7185", "#f472b6", "#e879f9", "#c084fc", 
            "#818cf8", "#60a5fa", "#38bdf8", "#2dd4bf", "#34d399", 
            "#4ade80", "#acc122", "#facc15", "#fb923c", "#f87171"
        ];

        function init() {
            renderList();
            drawWheel();
        }

        function setPlayer(player) {
            currentPlayer = player;
            const wheel = document.getElementById('wheel');
            const btnHicham = document.getElementById('btn-hicham');
            const btnMargot = document.getElementById('btn-margot');

            if (player === 'hicham') {
                wheel.style.borderColor = '#3b82f6'; // Bleu
                wheel.style.boxShadow = '0 10px 25px -5px rgba(59, 130, 246, 0.3)';
                btnHicham.className = "flex-1 py-2 px-3 text-xs font-bold rounded-xl border-2 border-blue-500 bg-blue-50 text-blue-600 transition shadow-sm";
                btnMargot.className = "flex-1 py-2 px-3 text-xs font-bold rounded-xl border-2 border-slate-200 bg-slate-50 text-slate-500 transition shadow-sm";
            } else {
                wheel.style.borderColor = '#22c55e'; // Vert
                wheel.style.boxShadow = '0 10px 25px -5px rgba(34, 197, 94, 0.3)';
                btnMargot.className = "flex-1 py-2 px-3 text-xs font-bold rounded-xl border-2 border-green-500 bg-green-50 text-green-600 transition shadow-sm";
                btnHicham.className = "flex-1 py-2 px-3 text-xs font-bold rounded-xl border-2 border-slate-200 bg-slate-50 text-slate-500 transition shadow-sm";
            }
        }

        function loadLocalImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imgTag = document.getElementById('real-img');
                    imgTag.src = e.target.result;
                    imgTag.style.display = 'block';
                    document.getElementById('center-text').style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        }

        function renderList() {
            const listEl = document.getElementById('resto-list');
            const countEl = document.getElementById('remaining-count');
            listEl.innerHTML = '';
            
            countEl.innerText = `${restos.length} établissement${restos.length > 1 ? 's' : ''} restant${restos.length > 1 ? 's' : ''}`;

            if (restos.length === 0) {
                listEl.innerHTML = '<li class="text-center py-6 text-slate-400 text-sm">La liste est vide ! Réinitialisez ou ajoutez de nouveaux lieux.</li>';
                document.getElementById('spin-btn').disabled = true;
                return;
            } else {
                document.getElementById('spin-btn').disabled = false;
            }

            restos.forEach((resto, index) => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center bg-white p-3 rounded-xl shadow-sm border border-slate-100 text-sm hover:border-rose-200 transition';
                li.innerHTML = `
                    <span class="font-medium text-slate-700 truncate pr-2">${resto}</span>
                    <button onclick="removeResto(${index})" class="text-slate-400 hover:text-rose-500 p-1 rounded-lg transition" title="Supprimer">
                        ✕
                    </button>
                `;
                listEl.appendChild(li);
            });
        }

        function drawWheel() {
            const wheel = document.getElementById('wheel');
            const currentBorderColor = wheel.style.borderColor || '#3b82f6';
            
            wheel.innerHTML = '';
            wheel.style.borderColor = currentBorderColor;

            const numSlices = restos.length;
            if (numSlices === 0) return;

            const sliceAngle = 360 / numSlices;

            restos.forEach((resto, index) => {
                const slice = document.createElement('div');
                slice.className = 'slice';
                
                const rotation = index * sliceAngle;
                slice.style.transform = `rotate(${rotation}deg) skewY(${90 - sliceAngle}deg)`;
                slice.style.backgroundColor = colors[index % colors.length];

                const text = document.createElement('div');
                text.className = 'slice-text';
                text.style.transform = `skewY(${-(90 - sliceAngle)}deg) rotate(${sliceAngle / 2}deg)`;
                text.innerText = resto;
                
                slice.appendChild(text);
                wheel.appendChild(slice);
            });
        }

        function addResto() {
            const input = document.getElementById('resto-input');
            const value = input.value.trim();
            if (value && !restos.includes(value)) {
                restos.push(value);
                input.value = '';
                init();
                document.getElementById('result-display').innerText = '';
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                addResto();
            }
        }

        function removeResto(index) {
            restos.splice(index, 1);
            init();
            document.getElementById('result-display').innerText = '';
        }

        function resetList() {
            restos = [...defaultRestos];
            init();
            document.getElementById('result-display').innerText = '';
        }

        function spinWheel() {
            if (isSpinning || restos.length === 0) return;
            isSpinning = true;
            document.getElementById('result-display').innerText = "La roue tourne...";
            document.getElementById('result-display').className = "text-center min-h-[40px] text-lg font-semibold text-slate-500 animate-pulse";

            const numSlices = restos.length;
            const sliceAngle = 360 / numSlices;

            const winningIndex = Math.floor(Math.random() * numSlices);
            
            const extraSpins = 360 * 6; 
            const targetAngle = extraSpins + (360 - (winningIndex * sliceAngle + sliceAngle / 2));
            
            currentRotation += targetAngle;
            const wheel = document.getElementById('wheel');
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                const chosenResto = restos[winningIndex];
                
                const resultDisplay = document.getElementById('result-display');
                
                if (currentPlayer === 'hicham') {
                    resultDisplay.className = "text-center min-h-[40px] text-xl font-bold text-blue-600 scale-105 transition-transform";
                    resultDisplay.innerHTML = `#gourmand : <span class="underline decoration-blue-400">${chosenResto}</span> !`;
                } else {
                    resultDisplay.className = "text-center min-h-[40px] text-xl font-bold text-green-600 scale-105 transition-transform";
                    resultDisplay.innerHTML = `#gourmande : <span class="underline decoration-green-400">${chosenResto}</span> !`;
                }
                
                restos.splice(winningIndex, 1);
                
                setTimeout(() => {
                    init();
                }, 1200);

            }, 4500);
        }

        window.onload = init;
    </script>
</body>
</html>
